name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # 1. Build and archive
  # ─────────────────────────────────────────────────────────────────────────
  build:
    name: Build & Archive
    runs-on: macos-14
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}

    env:
      CERT_P12: ${{ secrets.DEVELOPER_ID_APPLICATION_CERT_P12 }}
      CERT_PASS: ${{ secrets.DEVELOPER_ID_APPLICATION_CERT_PASS }}
      KEYCHAIN_PASS: ${{ secrets.KEYCHAIN_PASSWORD }}
      NOTARIZE_APPLE_ID: ${{ secrets.NOTARIZE_APPLE_ID }}
      NOTARIZE_TEAM_ID: ${{ secrets.NOTARIZE_TEAM_ID }}
      NOTARIZE_APP_PASSWORD: ${{ secrets.NOTARIZE_APP_SPECIFIC_PASSWORD }}
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Determine version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BUILD="${GITHUB_RUN_NUMBER}"
          echo "version=$VERSION"    >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD" >> "$GITHUB_OUTPUT"

      - name: Set bundle version in Info.plist
        run: |
          /usr/libexec/PlistBuddy -c \
            "Set :CFBundleShortVersionString ${{ steps.version.outputs.version }}" \
            Voxema/Info.plist
          /usr/libexec/PlistBuddy -c \
            "Set :CFBundleVersion ${{ steps.version.outputs.build_number }}" \
            Voxema/Info.plist

      # ── Code signing ──────────────────────────────────────────────────────
      - name: Import Developer ID certificate
        if: env.CERT_P12 != ''
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERT_PASS" \
            -T /usr/bin/codesign
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S "apple-tool:,apple:" \
            -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -scheme Voxema -project Voxema.xcodeproj

      - name: Archive
        run: |
          if [ -n "$CERT_P12" ]; then
            SIGN_FLAGS="CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=Developer\ ID\ Application"
          else
            # Ad-hoc: sign with '-' identity, no team required
            SIGN_FLAGS="CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= CODE_SIGNING_REQUIRED=YES CODE_SIGNING_ALLOWED=YES"
          fi

          xcodebuild archive \
            -scheme Voxema \
            -project Voxema.xcodeproj \
            -archivePath "$RUNNER_TEMP/Voxema.xcarchive" \
            -configuration Release \
            $SIGN_FLAGS \
            SKIP_INSTALL=NO \
            2>&1 | tee /tmp/xcodebuild_archive.log
          STATUS=${PIPESTATUS[0]}
          if [ $STATUS -ne 0 ]; then
            echo "=== Last 50 lines of build log ==="
            tail -50 /tmp/xcodebuild_archive.log
            exit $STATUS
          fi

      - name: Export archive
        run: |
          if [ -n "$CERT_P12" ]; then
            METHOD="developer-id"
            SIGNING_STYLE="manual"
          else
            METHOD="mac-application"
            SIGNING_STYLE="manual"
          fi

          cat > "$RUNNER_TEMP/ExportOptions.plist" << PLIST
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
  "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
  <key>method</key>
  <string>${METHOD}</string>
  <key>signingStyle</key>
  <string>${SIGNING_STYLE}</string>
</dict>
</plist>
PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Voxema.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            2>&1 | tee /tmp/xcodebuild_export.log
          STATUS=${PIPESTATUS[0]}
          if [ $STATUS -ne 0 ]; then
            echo "=== Last 30 lines of export log ==="
            tail -30 /tmp/xcodebuild_export.log
            exit $STATUS
          fi

      # ── Notarization ──────────────────────────────────────────────────────
      - name: Notarize app
        if: env.NOTARIZE_APPLE_ID != ''
        run: |
          xcrun notarytool submit "$RUNNER_TEMP/export/Voxema.app" \
            --apple-id "$NOTARIZE_APPLE_ID" \
            --team-id "$NOTARIZE_TEAM_ID" \
            --password "$NOTARIZE_APP_PASSWORD" \
            --wait
          xcrun stapler staple "$RUNNER_TEMP/export/Voxema.app"

      # ── DMG ───────────────────────────────────────────────────────────────
      - name: Create DMG
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          APP_PATH="$RUNNER_TEMP/export/Voxema.app"
          DMG_PATH="$RUNNER_TEMP/Voxema-${VERSION}.dmg"
          STAGING="$RUNNER_TEMP/dmg_staging"

          mkdir -p "$STAGING"
          cp -R "$APP_PATH" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"

          hdiutil create \
            -volname "Voxema ${VERSION}" \
            -srcfolder "$STAGING" \
            -ov -format UDBZ \
            "$DMG_PATH"

          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"

      # ── EdDSA signature ───────────────────────────────────────────────────
      - name: Sign DMG with EdDSA (Sparkle)
        if: env.SPARKLE_PRIVATE_KEY != ''
        run: |
          SPARKLE_VERSION="2.6.4"
          curl -sSL "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-for-Swift-Package-Manager.zip" \
            -o "$RUNNER_TEMP/sparkle.zip"
          unzip -q "$RUNNER_TEMP/sparkle.zip" -d "$RUNNER_TEMP/sparkle"

          echo "$SPARKLE_PRIVATE_KEY" | base64 --decode > "$RUNNER_TEMP/sparkle_key"

          SIGNATURE=$("$RUNNER_TEMP/sparkle/bin/sign_update" \
            --ed-key-file "$RUNNER_TEMP/sparkle_key" \
            "$DMG_PATH")
          echo "SPARKLE_SIGNATURE=$SIGNATURE" >> "$GITHUB_ENV"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Voxema-dmg
          path: ${{ env.DMG_PATH }}
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────
  # 2. Create GitHub Release
  # ─────────────────────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download DMG artifact
        uses: actions/download-artifact@v4
        with:
          name: Voxema-dmg
          path: ./dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: "Voxema ${{ needs.build.outputs.version }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          files: ./dist/*.dmg
          generate_release_notes: true

  # ─────────────────────────────────────────────────────────────────────────
  # 3. Publish appcast to gh-pages (served by Cloudflare Pages)
  # ─────────────────────────────────────────────────────────────────────────
  appcast:
    name: Publish Appcast
    needs: [build, release]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Update appcast.xml
        env:
          VERSION: ${{ needs.build.outputs.version }}
          BUILD: ${{ needs.build.outputs.build_number }}
          SIGNATURE: ${{ env.SPARKLE_SIGNATURE }}
          REPO: ${{ github.repository }}
        run: |
          DATE=$(date -u +"%a, %d %b %Y %H:%M:%S +0000")
          DMG_URL="https://github.com/${REPO}/releases/download/v${VERSION}/Voxema-${VERSION}.dmg"

          python3 - "$VERSION" "$BUILD" "$DATE" "$DMG_URL" "$SIGNATURE" << 'PYEOF'
          import sys, xml.etree.ElementTree as ET, os

          version, build, date, dmg_url, signature = sys.argv[1:]
          path = "appcast.xml"

          if not os.path.exists(path):
              with open(path, "w") as f:
                  f.write('<?xml version="1.0" encoding="UTF-8"?>\n'
                          '<rss version="2.0"\n'
                          '  xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle"\n'
                          '  xmlns:dc="http://purl.org/dc/elements/1.1/">\n'
                          '  <channel>\n'
                          '    <title>Voxema Updates</title>\n'
                          '    <link>https://voxema.pages.dev/appcast.xml</link>\n'
                          '    <description>Voxema release notes</description>\n'
                          '    <language>en</language>\n'
                          '  </channel>\n'
                          '</rss>\n')

          ET.register_namespace("sparkle", "http://www.andymatuschak.org/xml-namespaces/sparkle")
          ET.register_namespace("dc", "http://purl.org/dc/elements/1.1/")
          tree = ET.parse(path)
          root = tree.getroot()
          channel = root.find("channel")

          item = ET.Element("item")
          ET.SubElement(item, "title").text = f"Voxema {version}"
          ET.SubElement(item, "pubDate").text = date
          ET.SubElement(item, "{http://www.andymatuschak.org/xml-namespaces/sparkle}version").text = build
          ET.SubElement(item, "{http://www.andymatuschak.org/xml-namespaces/sparkle}shortVersionString").text = version
          enclosure = ET.SubElement(item, "enclosure")
          enclosure.set("url", dmg_url)
          enclosure.set("length", "0")
          enclosure.set("type", "application/octet-stream")
          if signature:
              enclosure.set("{http://www.andymatuschak.org/xml-namespaces/sparkle}edSignature", signature)

          # Insert new item at top of channel (after the 4 metadata elements)
          channel.insert(4, item)

          ET.indent(tree, space="  ")
          tree.write(path, encoding="unicode", xml_declaration=True)
          print(f"appcast.xml updated with v{version}")
          PYEOF

      - name: Commit and push appcast
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          git commit -m "chore: appcast v${{ needs.build.outputs.version }}" || echo "Nothing to commit"
          git push
